[project]
name = "geodesics"
version = "0.1.0"
description = "Go, topologically abstracted: Tromp-Taylor rules on arbitrary graphs over discretized surfaces"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
demo = ["matplotlib"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geodesics"]
