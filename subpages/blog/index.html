<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Writing and notes by Samuel D. Leventhal — topology, machine learning, and projects.">
  <meta name="author" content="Samuel D. Leventhal">

  <!-- Open Graph -->
  <meta property="og:title" content="Blog — Samuel D. Leventhal">
  <meta property="og:description" content="a space outside my head">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://samleventhal.com/subpages/blog/">

  <title>Writing — Samuel D. Leventhal</title>

  <!-- Fonts (same families as the main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX (math rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --color-bg: #faf9f7;
      --color-bg-alt: #f0efed;
      --color-text: #2c2c2c;
      --color-text-muted: #5a5a5a;
      --color-accent: #8b2332;
      --color-accent-light: #a83344;
      --color-border: #d4d2cf;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;

      --max-width: 900px;
      --reading-width: 720px;
      --spacing-unit: 1rem;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    a:hover { border-bottom-color: var(--color-accent); }

    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      background: var(--color-accent);
      color: #fff;
      padding: 0.5rem 1rem;
      z-index: 200;
      border-bottom: none;
    }
    .skip-link:focus { left: 0; }

    /* ---------- Navigation (mirrors main site) ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 0;
    }
    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 2rem;
      justify-content: center;
      list-style: none;
      padding: 0 var(--spacing-unit);
      max-width: var(--max-width);
      margin: 0 auto;
    }
    nav a {
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      padding: 0.25rem 0;
      position: relative;
      border-bottom: none;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--color-accent);
      transition: width 0.3s ease;
    }
    nav a:hover { color: var(--color-accent); }
    nav a:hover::after { width: 100%; }
    nav a[aria-current="page"] { color: var(--color-accent); }
    nav a[aria-current="page"]::after { width: 100%; }

    /* ---------- Page header ---------- */
    .page-header {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--spacing-unit) * 3) var(--spacing-unit) var(--spacing-unit);
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 0.25em;
      color: var(--color-text);
    }
    .page-header .tagline {
      font-weight: 300;
      font-size: 1.1rem;
      color: var(--color-text-muted);
      margin: 0;
      letter-spacing: 0.02em;
      max-width: var(--reading-width);
    }

    /* ---------- Main ---------- */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--spacing-unit) var(--spacing-unit) calc(var(--spacing-unit) * 4);
      min-height: 50vh;
    }

    /* ---------- Tag filter bar ---------- */
    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-border);
    }
    .tag-bar .tag-bar-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin-right: 0.25rem;
    }

    /* ---------- Tag chips (shared) ---------- */
    .chip {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--color-text-muted);
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      padding: 0.18rem 0.7rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      line-height: 1.6;
      white-space: nowrap;
    }
    .chip:hover { color: var(--color-accent); border-color: var(--color-accent); }
    .chip[aria-pressed="true"] {
      color: #fff;
      background: var(--color-accent);
      border-color: var(--color-accent);
    }

    /* ---------- Post list ---------- */
    .post-list { display: grid; gap: 1.25rem; }

    .post-card {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.6rem;
      padding: 1.5rem;
      background: var(--color-bg-alt);
      border-radius: 8px;
      border-left: 3px solid var(--color-accent);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .post-card.has-cover { grid-template-columns: 150px 1fr; gap: 1.25rem; align-items: start; }
    .post-card:hover { transform: translateX(4px); box-shadow: -4px 0 0 var(--color-accent-light); }

    .post-card .cover-thumb {
      grid-row: span 4;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 6px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
    }

    .post-card .post-meta {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .post-card h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.2;
      margin: 0;
    }
    .post-card h2 a { color: var(--color-text); border-bottom: none; }
    .post-card:hover h2 a { color: var(--color-accent); }
    .post-card .excerpt {
      margin: 0;
      font-size: 0.98rem;
      color: var(--color-text-muted);
    }
    .post-card .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.15rem; }

    /* ---------- Single post ---------- */
    .article-nav { margin-bottom: 1.5rem; }
    .back-link {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      border-bottom: none;
    }
    .back-link:hover { color: var(--color-accent); border-bottom: none; }

    article { max-width: var(--reading-width); margin: 0 auto; }

    .article-cover {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      margin-bottom: 1.75rem;
    }

    .article-header { margin-bottom: 2rem; }
    .article-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.015em;
      margin: 0 0 0.6rem;
      color: var(--color-text);
    }
    .article-header .post-meta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 0.85rem;
    }
    .article-header .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    /* Long-form body: everything marked.js renders lives here */
    .post-body { font-size: 1.08rem; }
    .post-body > *:first-child { margin-top: 0; }
    .post-body p { margin: 0 0 1.25rem; }
    .post-body h2 {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.25;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--color-border);
    }
    .post-body h3 {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
    }
    .post-body h4 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      margin: 1.75rem 0 0.5rem;
    }
    .post-body a { border-bottom: 1px solid color-mix(in srgb, var(--color-accent) 40%, transparent); }
    .post-body a:hover { border-bottom-color: var(--color-accent); }
    .post-body ul, .post-body ol { margin: 0 0 1.25rem; padding-left: 1.4rem; }
    .post-body li { margin-bottom: 0.4rem; }
    .post-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      display: block;
      margin: 1.75rem auto;
    }
    .post-body blockquote {
      margin: 1.75rem 0;
      padding: 0.25rem 0 0.25rem 1.25rem;
      border-left: 3px solid var(--color-accent);
      color: var(--color-text-muted);
      font-style: italic;
    }
    .post-body blockquote p:last-child { margin-bottom: 0; }
    .post-body code {
      font-family: var(--font-mono);
      font-size: 0.86em;
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 0.1em 0.35em;
    }
    .post-body pre {
      background: #2c2c2c;
      color: #f0efed;
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      overflow-x: auto;
      margin: 1.75rem 0;
      line-height: 1.55;
    }
    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.86rem;
      color: inherit;
    }
    .post-body hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2.5rem 0;
    }
    .post-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.75rem 0;
      font-size: 0.95rem;
    }
    .post-body th, .post-body td {
      border: 1px solid var(--color-border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .post-body th { background: var(--color-bg-alt); font-weight: 600; }

    /* Prev / next */
    .post-pager {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border);
    }
    .post-pager a {
      flex: 1;
      border-bottom: none;
      max-width: 48%;
    }
    .post-pager a:hover { border-bottom: none; }
    .post-pager .dir {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin-bottom: 0.2rem;
    }
    .post-pager .pager-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
      line-height: 1.25;
    }
    .post-pager a:hover .pager-title { color: var(--color-accent); }
    .post-pager .next { text-align: right; }

    /* ---------- States ---------- */
    .state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-text-muted);
      max-width: var(--reading-width);
      margin: 0 auto;
    }
    .state h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--color-text);
      margin: 0 0 0.5rem;
    }
    .state code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 0.1em 0.4em;
    }
    .state .hint {
      text-align: left;
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.92rem;
    }

    /* ---------- Footer ---------- */
    footer {
      border-top: 1px solid var(--color-border);
      padding: 2rem var(--spacing-unit);
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--color-text-muted); }
    footer a:hover { color: var(--color-accent); }

    /* ---------- Responsive ---------- */
    @media (max-width: 560px) {
      .post-card.has-cover { grid-template-columns: 1fr; }
      .post-card .cover-thumb { grid-row: auto; max-width: 200px; aspect-ratio: 16 / 9; }
      .post-pager { flex-direction: column; }
      .post-pager a { max-width: 100%; }
      .post-pager .next { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- NOTE: confirm these anchor targets match the section ids on your main page.
       If your homepage uses scrollToId('research') etc., the matching ids should exist. -->
  <nav aria-label="Primary">
    <ul>
      <li><a href="../../">Home</a></li>
      <li><a href="../../#research">Research</a></li>
      <li><a href="../../#projects">Projects</a></li>
      <li><a href="./" aria-current="page">Space</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1 id="blog-title">Space</h1>
    <p class="tagline" id="blog-tagline">A Space for Things.</p>
  </header>

  <main id="main" aria-live="polite">
    <div class="state"><p>Loading…</p></div>
  </main>

  <footer>
    <p>© <span id="year"></span> Samuel D. Leventhal · <a href="../../">samleventhal.com</a></p>
  </footer>

  <!-- Vendored locally: no external runtime dependency -->
  <script src="lib/marked.min.js"></script>
  <script>
  (function () {
    'use strict';

    /* ----------------------------------------------------------------
       Configuration — change these in one place.
    ---------------------------------------------------------------- */
    var BLOG = {
      title: '...',
	tagline: 'projects, notes, words.',
      manifest: 'posts.json',
      postsDir: 'posts/',
      wordsPerMinute: 200
    };

    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('blog-title').textContent = BLOG.title;
    document.getElementById('blog-tagline').textContent = BLOG.tagline;

    var mainEl = document.getElementById('main');
    var manifestCache = null;   // array of post objects
    var bodyCache = {};         // slug -> rendered HTML

    if (window.marked && typeof window.marked.use === 'function') {
      window.marked.use({ gfm: true, breaks: false });
    }

    /* ----------------------------- helpers ----------------------------- */

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Hide $...$ / $$...$$ from marked so backslashes and matrix row
    // separators (\\) survive Markdown parsing; restore them afterward.
    // Code spans are split out first so `$` inside code is left alone.
    function renderMarkdownWithMath(md) {
      if (!window.marked) return escapeHtml(md);
      var stash = [];
      function mask(m) { return '@@MATH' + (stash.push(m) - 1) + '@@'; }
      var parts = md.split(/(```[\s\S]*?```|`[^`\n]*`)/g);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].charAt(0) === '`') continue;      // code — untouched
        parts[i] = parts[i]
          .replace(/\$\$[\s\S]+?\$\$/g, mask)          // display math first
          .replace(/\$[^$\n]+?\$/g, mask);             // then inline math
      }
      var html = window.marked.parse(parts.join(''));
      return html.replace(/@@MATH(\d+)@@/g, function (_, n) { return stash[+n]; });
    }

    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

    // Parse YYYY-MM-DD without timezone drift.
    function formatDate(iso) {
      if (!iso) return '';
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
      if (!m) return iso;
      return MONTHS[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
    }

    function readingTime(html) {
      var text = html.replace(/<[^>]+>/g, ' ');
      var words = text.split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words / BLOG.wordsPerMinute));
    }

    function slugFromHash() {
      var h = location.hash.replace(/^#\/?/, '');
      var parts = h.split('/');
      return { route: parts[0] || '', arg: decodeURIComponent(parts.slice(1).join('/') || '') };
    }

    function setMain(html) {
      mainEl.innerHTML = html;
      // lazy-load any images marked.js produced
      var imgs = mainEl.querySelectorAll('.post-body img');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].setAttribute('loading', 'lazy');
        imgs[i].setAttribute('decoding', 'async');
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function chip(tag, pressed) {
      return '<button class="chip" data-tag="' + escapeHtml(tag) + '"' +
             (pressed ? ' aria-pressed="true"' : '') +
             '>' + escapeHtml(tag) + '</button>';
    }

    /* ----------------------------- data ----------------------------- */

    function loadManifest() {
      if (manifestCache) return Promise.resolve(manifestCache);
      return fetch(BLOG.manifest, { cache: 'no-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          var posts = Array.isArray(data) ? data : (data.posts || []);
          posts = posts.filter(function (p) { return p && p.slug && !p.draft; });
          manifestCache = posts;
          return posts;
        });
    }

    function loadPostBody(slug) {
      if (bodyCache[slug]) return Promise.resolve(bodyCache[slug]);
      return fetch(BLOG.postsDir + slug + '.md', { cache: 'no-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (md) {
          // Strip an optional --- front-matter block if present.
          md = md.replace(/^\s*---\n[\s\S]*?\n---\s*\n?/, '');
          var html = renderMarkdownWithMath(md);
          bodyCache[slug] = html;
          return html;
        });
    }

    /* ----------------------------- views ----------------------------- */

    function renderList(filterTag) {
      loadManifest().then(function (posts) {
        var shown = filterTag
          ? posts.filter(function (p) { return (p.tags || []).indexOf(filterTag) !== -1; })
          : posts;

        // gather all tags for the filter bar
        var tagSet = {};
        posts.forEach(function (p) { (p.tags || []).forEach(function (t) { tagSet[t] = true; }); });
        var allTags = Object.keys(tagSet).sort();

        var html = '';

        if (allTags.length) {
          html += '<div class="tag-bar">';
          html += '<span class="tag-bar-label">Filter</span>';
          html += '<button class="chip" data-tag="" ' + (!filterTag ? 'aria-pressed="true"' : '') + '>All</button>';
          allTags.forEach(function (t) { html += chip(t, t === filterTag); });
          html += '</div>';
        }

        if (!shown.length) {
          if (filterTag) {
            html += '<div class="state"><h2>Nothing tagged “' + escapeHtml(filterTag) + '” yet</h2>' +
                    '<p><a href="#/">Show all posts</a></p></div>';
          } else {
            html += emptyState();
          }
          setMain(html);
          document.title = BLOG.title + ' — Samuel D. Leventhal';
          return;
        }

        html += '<div class="post-list">';
        shown.forEach(function (p) {
          var url = '#/post/' + encodeURIComponent(p.slug);
          var hasCover = !!p.cover;
          html += '<article class="post-card' + (hasCover ? ' has-cover' : '') + '">';
          if (hasCover) {
            html += '<img class="cover-thumb" src="' + escapeHtml(p.cover) + '" alt="" loading="lazy" decoding="async">';
          }
          html += '<div class="post-meta">' + escapeHtml(formatDate(p.date)) + '</div>';
          html += '<h2><a href="' + url + '">' + escapeHtml(p.title) + '</a></h2>';
          if (p.excerpt) html += '<p class="excerpt">' + escapeHtml(p.excerpt) + '</p>';
          if (p.tags && p.tags.length) {
            html += '<div class="card-tags">';
            p.tags.forEach(function (t) { html += chip(t, false); });
            html += '</div>';
          }
          html += '</article>';
        });
        html += '</div>';

        setMain(html);
        document.title = (filterTag ? filterTag + ' — ' : '') + BLOG.title + ' — Samuel D. Leventhal';
      }).catch(function (err) {
        setMain(errorState(BLOG.manifest, err));
      });
    }

    function renderPost(slug) {
      loadManifest().then(function (posts) {
        var idx = -1;
        for (var i = 0; i < posts.length; i++) { if (posts[i].slug === slug) { idx = i; break; } }
        if (idx === -1) {
          setMain('<div class="state"><h2>Post not found</h2>' +
                  '<p>There’s no post with the id “' + escapeHtml(slug) + '”.</p>' +
                  '<p><a href="#/">Back to all posts</a></p></div>');
          document.title = 'Not found — ' + BLOG.title;
          return;
        }
        var p = posts[idx];

        loadPostBody(slug).then(function (bodyHtml) {
          var html = '';
          html += '<div class="article-nav"><a class="back-link" href="#/">← All writing</a></div>';
          html += '<article>';
          if (p.cover) {
            html += '<img class="article-cover" src="' + escapeHtml(p.cover) + '" alt="' + escapeHtml(p.coverAlt || '') + '">';
          }
          html += '<header class="article-header">';
          html += '<div class="post-meta">' + escapeHtml(formatDate(p.date)) +
                  ' · ' + readingTime(bodyHtml) + ' min read</div>';
          html += '<h1>' + escapeHtml(p.title) + '</h1>';
          if (p.tags && p.tags.length) {
            html += '<div class="card-tags">';
            p.tags.forEach(function (t) { html += chip(t, false); });
            html += '</div>';
          }
          html += '</header>';
          html += '<div class="post-body">' + bodyHtml + '</div>';

          // prev (newer, earlier in array) / next (older, later in array)
          var newer = posts[idx - 1];
          var older = posts[idx + 1];
          if (newer || older) {
            html += '<nav class="post-pager" aria-label="More posts">';
            if (newer) {
              html += '<a class="prev" href="#/post/' + encodeURIComponent(newer.slug) + '">' +
                      '<span class="dir">← Newer</span>' +
                      '<span class="pager-title">' + escapeHtml(newer.title) + '</span></a>';
            } else { html += '<span></span>'; }
            if (older) {
              html += '<a class="next" href="#/post/' + encodeURIComponent(older.slug) + '">' +
                      '<span class="dir">Older →</span>' +
                      '<span class="pager-title">' + escapeHtml(older.title) + '</span></a>';
            } else { html += '<span></span>'; }
            html += '</nav>';
          }

          html += '</article>';
          setMain(html);
          if (window.renderMathInElement) {
            renderMathInElement(mainEl, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$',  right: '$',  display: false }
              ],
              throwOnError: false
            });
          }
          document.title = p.title + ' — ' + BLOG.title;
        }).catch(function (err) {
          setMain(errorState(BLOG.postsDir + slug + '.md', err));
        });
      }).catch(function (err) {
        setMain(errorState(BLOG.manifest, err));
      });
    }

    /* ----------------------------- empty / error ----------------------------- */

    function emptyState() {
      return '<div class="state">' +
        '<h2>No posts yet</h2>' +
        '<p>Add your first post in two steps.</p>' +
        '<div class="hint">' +
        '1. Create <code>posts/my-first-post.md</code> and write in Markdown.<br>' +
        '2. Add an entry to <code>posts.json</code> with a matching <code>slug</code>.' +
        '</div></div>';
    }

    function errorState(target, err) {
      var isFileProto = location.protocol === 'file:';
      var html = '<div class="state"><h2>Couldn’t load ' + escapeHtml(target) + '</h2>';
      if (isFileProto) {
        html += '<p>It looks like this page was opened directly from disk. Browsers block loading local files this way.</p>' +
                '<div class="hint">Serve the folder over HTTP instead. From your repo root:<br>' +
                '<code>python3 -m http.server</code><br>' +
                'then open <code>http://localhost:8000/subpages/blog/</code>.<br><br>' +
                'On the live GitHub Pages site it just works — no server needed.</div>';
      } else {
        html += '<p>Make sure <code>' + escapeHtml(target) + '</code> exists and is valid.</p>' +
                '<p style="font-size:0.85rem;opacity:0.8;">' + escapeHtml(String(err)) + '</p>';
      }
      html += '</div>';
      return html;
    }

    /* ----------------------------- router ----------------------------- */

    function route() {
      var r = slugFromHash();
      if (r.route === 'post' && r.arg) {
        renderPost(r.arg);
      } else if (r.route === 'tag' && r.arg) {
        renderList(r.arg);
      } else {
        renderList(null);
      }
    }

    // Delegated click handling for tag chips (list + article).
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.chip') : null;
      if (!btn) return;
      var tag = btn.getAttribute('data-tag');
      location.hash = tag ? '#/tag/' + encodeURIComponent(tag) : '#/';
    });

    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>
