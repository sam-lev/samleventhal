const NODE_COLORS = {person:getCss('--person'), institution:getCss('--institution')};
const EDGE_TYPES = ['coauthor','affiliated_with','colleague'];
const edgeColor = t => getCss('--'+t) || getCss('--dim');
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg = d3.select('#canvas');
const W = () => svg.node().clientWidth, H = () => svg.node().clientHeight;
const root = svg.append('g');
const linkG = root.append('g'), nodeG = root.append('g'), labelG = root.append('g');

const nodes = GRAPH.nodes.map(d => Object.assign({}, d));
const idset = new Set(nodes.map(d=>d.id));
const links = GRAPH.links.filter(l=>idset.has(l.source)&&idset.has(l.target)).map(d=>Object.assign({}, d));
document.getElementById('counts').textContent =
  nodes.filter(n=>n.kind==='person').length + ' people · ' +
  nodes.filter(n=>n.kind==='institution').length + ' institutions · ' + links.length + ' edges';

const deg = {}; links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1; deg[l.target]=(deg[l.target]||0)+1;});
const r = d3.scaleSqrt().domain([0, d3.max(nodes,n=>deg[n.id]||1)||1]).range([4, 15]);

const active = {coauthor:true, affiliated_with:true, colleague:true};
let minW = 0;

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(l=>l.type==='affiliated_with'?40:70).strength(l=>Math.min(0.9,(l.weight||1)/5)))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('center', d3.forceCenter())
  .force('collide', d3.forceCollide().radius(d=>r(deg[d.id]||1)+3));
if (reduce){ sim.alphaDecay(0.1); }

let link = linkG.attr('stroke-linecap','round').selectAll('line');
let node = nodeG.selectAll('circle');
let label = labelG.selectAll('text');

function draw(){
  const lf = links.filter(l => active[l.type] && (l.weight||1) >= minW);
  link = link.data(lf, d=>d.source.id+'-'+d.target.id+'-'+d.type).join('line')
    .attr('stroke', d=>edgeColor(d.type))
    .attr('stroke-width', d=>Math.max(0.6, Math.sqrt(d.weight||1)))
    .attr('stroke-opacity', .42);

  node = node.data(nodes, d=>d.id).join('circle')
    .attr('class','node')
    .attr('r', d=>r(deg[d.id]||1))
    .attr('fill', d=>NODE_COLORS[d.kind]||getCss('--muted'))
    .attr('stroke', d=>d.seed_distance===0?getCss('--seed'):getCss('--ink'))
    .attr('stroke-width', d=>d.seed_distance===0?2.4:1.2)
    .on('mouseover', hover).on('mousemove', moveTip).on('mouseout', unhover)
    .on('click', (e,d)=>select(d))
    .call(d3.drag().on('start',dstart).on('drag',ddrag).on('end',dend));
  node.append('title').text(d=>d.name);

  label = label.data(nodes.filter(d=>(deg[d.id]||0)>=3 || d.seed_distance===0), d=>d.id)
    .join('text').attr('class','lbl').attr('dx',d=>r(deg[d.id]||1)+3).attr('dy',3)
    .text(d=>d.name);
  sim.alpha(0.6).restart();
}

sim.on('tick', ()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('cx',d=>d.x).attr('cy',d=>d.y);
  label.attr('x',d=>d.x).attr('y',d=>d.y);
});

// zoom/pan
const zoom = d3.zoom().scaleExtent([0.15, 6]).on('zoom', e=>root.attr('transform', e.transform));
svg.call(zoom);
function recenter(){ const t=d3.zoomIdentity.translate(W()/2,H()/2); svg.transition().duration(reduce?0:400).call(zoom.transform,t); }
recenter(); window.addEventListener('resize', ()=>sim.force('center', d3.forceCenter()).alpha(.2).restart());

// drag
function dstart(e,d){ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; }
function ddrag(e,d){ d.fx=e.x; d.fy=e.y; }
function dend(e,d){ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }

// hover highlight
const tip = document.getElementById('tip');
const adj = {}; links.forEach(l=>{(adj[l.source.id||l.source]=adj[l.source.id||l.source]||new Set()).add(l.target.id||l.target);
  (adj[l.target.id||l.target]=adj[l.target.id||l.target]||new Set()).add(l.source.id||l.source);});

// weighted adjacency + association ranking (used by the collapsible menus)
const idToNode = new Map(nodes.map(n=>[n.id, n]));
const wadj = new Map();
function _aw(a,b,w){ if(!wadj.has(a)) wadj.set(a,[]); wadj.get(a).push({to:b, w:(w||1)}); }
links.forEach(l=>{ const s=l.source.id||l.source, t=l.target.id||l.target; _aw(s,t,l.weight); _aw(t,s,l.weight); });
const _assocMemo = new Map();
function associationsFrom(startId){
  // Dijkstra with edge length = 1/weight, so a stronger tie is a shorter
  // "association distance". dist ranks closeness; hops is the path length.
  if(_assocMemo.has(startId)) return _assocMemo.get(startId);
  const dist = new Map(), hops = new Map(), done = new Set();
  nodes.forEach(n=>{ dist.set(n.id, Infinity); hops.set(n.id, Infinity); });
  dist.set(startId, 0); hops.set(startId, 0);
  while(true){
    let u=null, best=Infinity;
    dist.forEach((d,id)=>{ if(!done.has(id) && d<best){ best=d; u=id; } });
    if(u===null || best===Infinity) break;
    done.add(u);
    (wadj.get(u)||[]).forEach(({to,w})=>{
      const nd = dist.get(u) + 1/Math.max(w, 0.01);
      if(nd < dist.get(to)){ dist.set(to, nd); hops.set(to, hops.get(u)+1); }
    });
  }
  const res = {dist, hops};
  _assocMemo.set(startId, res);
  return res;
}
function assocRows(items, hops, isInst){
  const dcol = isInst ? NODE_COLORS.institution : NODE_COLORS.person;
  if(!items.length) return '<div class="ar-empty">none reachable</div>';
  return items.slice(0,60).map(n=>{
    const h = hops.get(n.id);
    const sub = (!isInst && n.pos_org)
      ? `<div class="ar-sub">${esc([n.pos_title,n.pos_org].filter(Boolean).join(' \u00b7 '))}</div>` : '';
    const hop = isFinite(h) ? (h+' hop'+(h===1?'':'s')) : '\u2014';
    return `<div class="ar" data-id="${esc(n.id)}">`
      + `<span class="dot" style="background:${dcol}"></span>`
      + `<div class="ar-main"><div class="ar-name">${esc(n.name)}</div>${sub}</div>`
      + `<span class="ar-hop">${hop}</span></div>`;
  }).join('');
}
function hover(e,d){
  const keep = adj[d.id]||new Set();
  node.attr('opacity', n=>(n.id===d.id||keep.has(n.id))?1:.15);
  link.attr('stroke-opacity', l=>(l.source.id===d.id||l.target.id===d.id)?.85:.05);
  label.attr('opacity', n=>(n.id===d.id||keep.has(n.id))?1:.1);
  tip.textContent = d.name + (d.pos_org?(' · '+d.pos_org):''); tip.style.opacity=1; moveTip(e);
}
function moveTip(e){ tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; }
function unhover(){ node.attr('opacity',1); link.attr('stroke-opacity',.42); label.attr('opacity',1); tip.style.opacity=0; }

// inspector
const insp = document.getElementById('inspector');
function select(d){
  const col = NODE_COLORS[d.kind]||getCss('--muted');
  const conf = d.pos_conf!=null ? Math.round(d.pos_conf*100) : null;
  const myEdges = links.filter(l=>l.source.id===d.id||l.target.id===d.id)
    .sort((a,b)=>(b.weight||0)-(a.weight||0)).slice(0,12);
  const {dist, hops} = associationsFrom(d.id);
  const reach = n => isFinite(dist.get(n.id));
  const insts = nodes.filter(n=>n.kind==='institution' && reach(n))
    .sort((a,b)=>dist.get(a.id)-dist.get(b.id));            // closest (most associated) first
  const ppl = nodes.filter(n=>n.kind==='person' && n.id!==d.id && reach(n))
    .sort((a,b)=>dist.get(a.id)-dist.get(b.id));
  insp.innerHTML = `
    <div class="insp-head">
      <div class="insp-kind" style="color:${col}">${d.kind}${d.seed_distance===0?' · seed':(d.seed_distance!=null?(' · hop '+d.seed_distance):'')}</div>
      <div class="insp-name">${esc(d.name)}</div>
    </div>
    <div class="insp-body">
      ${d.pos_org?field('position', esc([d.pos_title,d.pos_org].filter(Boolean).join(' · '))):''}
      ${conf!=null?`<div class="field"><div class="k">confidence</div><div class="v" style="flex:1">${conf}%<div class="conf"><i style="width:${conf}%;background:${col}"></i></div></div></div>`:''}
      ${d.source?field('source', esc(d.source)):''}
      ${d.cited_by_count!=null?field('citations', d.cited_by_count.toLocaleString()):''}
      ${field('degree', (deg[d.id]||0)+' connections')}
      <div class="edges">${myEdges.map(l=>{
        const other = l.source.id===d.id?l.target:l.source;
        return `<div class="edge"><span class="dot" style="background:${edgeColor(l.type)}"></span>
          <b>${esc(other.name)}</b> <span style="margin-left:auto">${l.type} ${l.weight?('· '+(+l.weight).toFixed(1)):''}</span></div>`;
      }).join('')}</div>
      <details><summary>Institutions by association <span class="cnt">${insts.length}</span></summary>
        <div class="assoc-list">${assocRows(insts, hops, true)}</div></details>
      <details><summary>People by association <span class="cnt">${ppl.length}</span></summary>
        <div class="assoc-list">${assocRows(ppl, hops, false)}</div></details>
    </div>`;
  insp.classList.add('open');
  insp.querySelectorAll('.ar').forEach(el=>{
    el.addEventListener('click', ()=>{ const n = idToNode.get(el.getAttribute('data-id')); if(n) select(n); });
  });
}
function field(k,v){ return `<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
svg.on('click', e=>{ if(e.target.tagName==='svg') insp.classList.remove('open'); });

// legend (encodes node kinds + toggleable edge types)
const legend = d3.select('#legend');
legend.append('div').attr('class','row').style('cursor','default').html(
  `<span class="sw" style="background:${NODE_COLORS.person}"></span>person`);
legend.append('div').attr('class','row').style('cursor','default').html(
  `<span class="sw" style="background:${NODE_COLORS.institution}"></span>institution`);
legend.append('div').attr('class','legend-note').text('— click an edge type to toggle —');
EDGE_TYPES.forEach(t=>{
  const n = links.filter(l=>l.type===t).length;
  const row = legend.append('div').attr('class','row').attr('tabindex',0)
    .html(`<span class="sw" style="background:${edgeColor(t)}"></span>${t}<span class="ct">${n}</span>`);
  const toggle=()=>{ active[t]=!active[t]; row.style('opacity',active[t]?1:.4); draw(); };
  row.on('click',toggle).on('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} });
});

// search
const search = document.getElementById('search');
search.addEventListener('input', ()=>{
  const q = search.value.trim().toLowerCase();
  if(!q){ node.attr('opacity',1).attr('stroke-width',d=>d.seed_distance===0?2.4:1.2); return; }
  const hits = nodes.filter(n=>n.name.toLowerCase().includes(q));
  node.attr('opacity',n=>hits.includes(n)?1:.12)
      .attr('stroke',n=>hits.includes(n)?getCss('--text'):(n.seed_distance===0?getCss('--seed'):getCss('--ink')))
      .attr('stroke-width',n=>hits.includes(n)?2.6:(n.seed_distance===0?2.4:1.2));
  if(hits.length===1) select(hits[0]);
});

// min weight
const minwEl=document.getElementById('minw'), minwVal=document.getElementById('minwval');
minwEl.addEventListener('input',()=>{ minW=+minwEl.value; minwVal.textContent=minW.toFixed(1); draw(); });
document.getElementById('reset').addEventListener('click',()=>{
  search.value=''; minW=0; minwEl.value=0; minwVal.textContent='0';
  EDGE_TYPES.forEach(t=>active[t]=true); legend.selectAll('.row').style('opacity',1);
  insp.classList.remove('open'); draw(); recenter();
});

draw();
</script>
</body>
</html>
